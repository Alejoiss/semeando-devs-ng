<article class="flex flex-col gap-3 p-6 rounded-2xl bg-[#0f1930] min-h-[120px] relative overflow-hidden">
    @if (isLoading()) {
        <div class="animate-pulse flex flex-col gap-3">
            <div class="h-4 w-24 rounded-lg bg-[#141f38]"></div>
            <div class="h-8 w-32 rounded-lg bg-[#141f38]"></div>
            <div class="h-3 w-16 rounded-lg bg-[#141f38]"></div>
        </div>
    } @else if (hasError()) {
        <div class="flex items-center gap-2 text-[#ff716c]">
            <span class="material-symbols-outlined text-xl">error_outline</span>
            <span class="text-sm font-label text-[#dee5ff]/60">Erro ao carregar</span>
        </div>
    } @else {
        <div class="flex items-center justify-between">
            <span class="text-xs font-label uppercase tracking-wider text-[#dee5ff]/50">{{ label() }}</span>
            <span class="material-symbols-outlined text-xl text-[#3fc2fb]">{{ icon() }}</span>
        </div>

        <div class="text-2xl font-bold font-headline text-[#dee5ff]">{{ value() }}</div>

        @if (trend() !== null) {
            <div class="flex items-center gap-1 text-xs font-label"
                 [class.text-[#e8ffc0]]="(trend() ?? 0) >= 0"
                 [class.text-[#ff716c]]="(trend() ?? 0) < 0">
                <span class="material-symbols-outlined text-sm">
                    {{ (trend() ?? 0) >= 0 ? 'trending_up' : 'trending_down' }}
                </span>
                <span>{{ (trend() ?? 0) >= 0 ? '+' : '' }}{{ trend() }}% vs período anterior</span>
            </div>
        }
    }
</article>
